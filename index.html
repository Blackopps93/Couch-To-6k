<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#ea580c"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>

  <title>Ski Fit Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#fff7ed;font-family:'Nunito',sans-serif;color:#1c1917}

    .app{max-width:480px;margin:0 auto;min-height:100vh;background:#fff7ed}

    .nav button.active{color:#ea580c;border-bottom-color:#ea580c}
    .header{background:linear-gradient(135deg,#ea580c,#f97316,#fb923c);padding:18px 20px 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px rgba(234,88,12,0.3)}

    .header-sub{font-size:10px;color:rgba(255,255,255,0.85);letter-spacing:1px;margin-top:2px;font-weight:600}
    .pbar-out{height:6px;background:rgba(255,255,255,0.3);border-radius:3px;overflow:hidden;width:120px}
    .pbar-in{height:100%;background:#fff;border-radius:3px;transition:width 0.5s}
    .pct{font-size:12px;color:#fff;font-weight:800;margin-bottom:4px;text-align:right}
    .scroll{height:calc(100vh - 110px);overflow-y:auto;padding-bottom:60px;background:#fff7ed}
    .scroll::-webkit-scrollbar{width:4px}
    .scroll::-webkit-scrollbar-thumb{background:#fed7aa;border-radius:3px}
    .wk-block{padding:12px 16px 4px}
    .wk-label{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:4px;color:#ea580c;margin-bottom:8px;display:flex;align-items:center;gap:8px}
    .wk-label::after{content:'';flex:1;height:1px;background:#fed7aa}
    .card{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #fed7aa;border-radius:12px;padding:11px 12px;margin-bottom:7px;box-shadow:0 2px 8px rgba(251,146,60,0.08)}
    .card.done-today{background:#f0fdf4;border-color:#bbf7d0}
    .card.missed-session{background:#fef2f2;border-color:#fecaca;opacity:0.75}
    .chk{width:32px;height:32px;border-radius:50%;border:2.5px solid #d1d5db;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;font-weight:900;color:transparent;transition:all 0.2s}
    .chk.done{background:linear-gradient(135deg,#22c55e,#16a34a);border-color:transparent;color:white}
    .sname{font-size:13px;font-weight:800;color:#1c1917;margin-bottom:1px}
    .card.done-today .sname{color:#15803d}
    .smeta{font-size:10px;color:#78716c;font-weight:600}
    .start-btn{background:linear-gradient(135deg,#f97316,#ea580c);border:none;border-radius:8px;color:white;padding:6px 12px;font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap}
    .view-btn{background:rgba(249,115,22,0.1);border:1.5px solid rgba(249,115,22,0.3);border-radius:8px;color:#ea580c;padding:6px 10px;font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;margin-right:4px}
    .race-card{background:linear-gradient(135deg,#fff7ed,#fef3c7)!important;border-color:#f97316!important}
    .race-card.race-day{background:linear-gradient(135deg,#f0fdf4,#dcfce7)!important;border-color:#16a34a!important}
    .race-card.race-day .sname{color:#15803d}
    .session-count{background:#fff7ed;border:1.5px solid #fed7aa;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:800;color:#ea580c;white-space:nowrap}
    /* MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:100;display:flex;align-items:flex-end}
    .modal{background:#f8fafc;border-radius:20px 20px 0 0;padding:20px 16px;max-height:92vh;overflow-y:auto;width:100%;max-width:480px;margin:0 auto}
    .modal-close{float:right;background:none;border:none;font-size:22px;cursor:pointer;color:#78716c;margin-top:-2px}
    .modal-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;color:#ea580c;margin-bottom:2px}
    .modal-sub{font-size:11px;color:#78716c;font-weight:700;margin-bottom:14px;letter-spacing:1px}
    .ex-card{background:#fff;border:2px solid #e2e8f0;border-radius:14px;margin-bottom:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,0.05)}
    .ex-header{padding:14px 14px 0 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .ex-title-col{flex:1}
    .ex-name{font-size:16px;font-weight:900;color:#1c1917;margin-bottom:3px}
    .ex-muscle{font-size:10px;font-weight:800;color:#ea580c;letter-spacing:1px;margin-bottom:4px}
    .ex-sets-badge{display:inline-block;background:#fff7ed;border:1.5px solid #fed7aa;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:800;color:#92400e}
    .ex-diff{font-size:20px;letter-spacing:1px;flex-shrink:0;margin-top:2px}
    .ex-tip{margin:10px 14px;font-size:11px;color:#64748b;font-weight:700;line-height:1.6;background:#f8fafc;border-radius:8px;padding:8px 10px;border-left:3px solid #f97316}
    .session-logger{margin:0 14px 14px;background:#fefce8;border-radius:10px;padding:12px;border:1.5px solid #fde68a}
    .session-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .session-title{font-size:10px;font-weight:800;color:#92400e;letter-spacing:2px}
    .session-last{font-size:10px;font-weight:700;color:#78716c}
    .set-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
    .set-num{font-size:11px;font-weight:800;color:#92400e;width:38px;flex-shrink:0}
    .set-col{display:flex;flex-direction:column;flex:1}
    .set-input{background:#fff;border:1.5px solid #fed7aa;border-radius:8px;padding:9px 8px;font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;color:#1c1917;outline:none;text-align:center;width:100%}
    .set-input:focus{border-color:#f97316}
    .set-input::placeholder{color:#d1d5db;font-size:12px;font-weight:600}
    .set-lbl{font-size:9px;color:#a8a29e;font-weight:700;text-align:center;margin-top:3px}
    .tick-btn{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;font-weight:900}
    .tick-done{background:linear-gradient(135deg,#22c55e,#16a34a);color:white;box-shadow:0 2px 8px rgba(34,197,94,0.35)}
    .tick-todo{background:#f0fdf4;border:2px solid #bbf7d0;color:#86efac}
    .pb-strip{margin-top:8px;padding-top:8px;border-top:1px dashed #fde68a;display:flex;align-items:center;gap:8px}
    .pb-badge{background:linear-gradient(135deg,#f59e0b,#d97706);color:white;border-radius:20px;padding:2px 9px;font-size:10px;font-weight:800;white-space:nowrap}
    .pb-text{font-size:11px;color:#78716c;font-weight:700}
    .history-section{margin:0 14px 14px}
    .history-toggle{width:100%;background:none;border:1.5px solid #e2e8f0;border-radius:8px;padding:8px 12px;font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;color:#64748b;cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between}
    .history-toggle:hover{border-color:#fed7aa;color:#ea580c}
    .history-list{margin-top:8px}
    .history-session{background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;padding:10px 12px;margin-bottom:6px}
    .history-session-date{font-size:10px;font-weight:800;color:#ea580c;letter-spacing:1px;margin-bottom:6px}
    .history-set-row{display:flex;gap:8px;align-items:center;margin-bottom:4px}
    .history-set-num{font-size:10px;font-weight:800;color:#94a3b8;width:34px}
    .history-set-badge{background:#f0fdf4;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:800;color:#15803d}
    .pb-strip{margin-top:8px;padding-top:8px;border-top:1px dashed #fde68a;display:flex;align-items:center;gap:8px}
    .wsec{padding:16px}
    .stitle{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:3px;color:#ea580c;margin-bottom:12px}
    .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
    .scard{background:#fff;border:2px solid #fed7aa;border-radius:12px;padding:12px 8px;text-align:center}
    .sval{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;margin-bottom:2px}
    .slbl{font-size:9px;color:#a8a29e;letter-spacing:2px;font-weight:700}
    .chart-box{background:#fff;border:2px solid #fed7aa;border-radius:12px;padding:14px;margin-bottom:16px}
    .chart-title{font-size:10px;color:#a8a29e;letter-spacing:2px;font-weight:700;margin-bottom:10px}
    .ms-row{display:flex;margin-bottom:16px;position:relative}
    .ms-row::before{content:'';position:absolute;top:12px;left:12px;right:12px;height:2px;background:#fed7aa;z-index:0}
    .ms-dot-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;z-index:1}
    .ms-dot{width:24px;height:24px;border-radius:50%;border:2.5px solid #fed7aa;background:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;transition:all 0.3s}
    .ms-dot.reached{background:linear-gradient(135deg,#22c55e,#16a34a);border-color:transparent;color:white}
    .ms-dot.current{border-color:#f97316;background:#fff7ed}
    .ms-wk{font-size:8px;color:#78716c;font-weight:700;text-align:center}
    .ms-tgt{font-size:8px;color:#a8a29e;font-weight:600}
    .units{display:flex;background:#fef3c7;border:2px solid #fde68a;border-radius:10px;overflow:hidden;width:fit-content;margin-bottom:10px}
    .units button{padding:7px 12px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;cursor:pointer;background:none;border:none;color:#a8a29e;transition:all 0.2s}
    .units button.active{background:#f97316;color:white}
    .log-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
    .winput{flex:1;background:#fff;border:2px solid #fed7aa;border-radius:10px;padding:10px 12px;color:#1c1917;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;outline:none}
    .winput:focus{border-color:#f97316}
    .log-btn{background:linear-gradient(135deg,#f97316,#ea580c);border:none;border-radius:10px;color:white;padding:10px 16px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
    .hist-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#fff;border:2px solid #fed7aa;border-radius:10px;margin-bottom:6px}
    .hist-date{font-size:11px;color:#78716c;font-weight:700}
    .hist-w{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#1c1917;letter-spacing:1px}
    .delta{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:700}
    .dg{background:#dcfce7;color:#15803d}.db{background:#fee2e2;color:#dc2626}
    .del{background:none;border:none;color:#d1d5db;cursor:pointer;font-size:14px;padding:2px 5px}
    .empty{text-align:center;padding:24px 0;color:#a8a29e;font-size:11px;font-weight:700;letter-spacing:1px}
    .tscreen{min-height:calc(100vh - 48px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;text-align:center}
    .back-btn{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #fed7aa;border-radius:10px;color:#78716c;padding:9px 14px;font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;cursor:pointer;margin:12px 16px 0;width:fit-content}
    .phase-lbl{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:5px;margin-bottom:6px}
    .bigtime{font-family:'Bebas Neue',sans-serif;font-size:clamp(70px,20vw,120px);line-height:1;letter-spacing:4px;margin-bottom:4px}
    .round-info{font-size:11px;color:#78716c;letter-spacing:2px;font-weight:700;margin-bottom:28px}
    .ring-wrap{position:relative;width:200px;height:200px;margin:0 auto 24px;border-radius:50%}
    .ring-svg{transform:rotate(-90deg)}
    .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .ctrl-row{display:flex;gap:14px;align-items:center;justify-content:center}
    .ctrl{border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;font-size:18px}
    .ctrl.big{width:68px;height:68px;background:linear-gradient(135deg,#f97316,#ea580c);color:white;font-size:24px;box-shadow:0 6px 24px rgba(234,88,12,0.4)}
    .ctrl.sm{width:52px;height:52px;background:#fff;color:#78716c;border:2px solid #e7e5e4}
    .done-banner{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:3px;background:linear-gradient(135deg,#f59e0b,#16a34a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
    .mark-btn{background:linear-gradient(135deg,#22c55e,#16a34a);border:none;border-radius:12px;color:white;padding:14px 32px;font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;cursor:pointer;margin-top:20px;box-shadow:0 6px 20px rgba(34,197,94,0.35)}
    .qdots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:18px;max-width:280px}
    .qdot{width:10px;height:10px;border-radius:50%;transition:all 0.3s}
    @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-10px)}}
    .bounce{animation:bounce 0.6s ease infinite alternate;font-size:56px;margin-bottom:10px}
  </style>
</head>
<body>
<div class="app" id="app"></div>
<script>

const EXERCISES={
  "Press Ups":{muscle:"CHEST · SHOULDERS · TRICEPS",diff:"⭐⭐",sets:"3 × 10 reps",tip:"Keep body straight head to heels. Lower chest to floor, push up explosively. Go to knees to start."},
  "Plank":{muscle:"CORE · SHOULDERS",diff:"⭐⭐",sets:"3 × 30 sec",tip:"Elbows under shoulders. Squeeze glutes, abs and quads all at once. Rest and restart if hips drop."},
  "Mountain Climbers":{muscle:"CORE · CARDIO · SHOULDERS",diff:"⭐⭐⭐",sets:"3 × 20 reps",tip:"Hips low and level. Drive each knee toward your chest as fast as possible."},
  "Bodyweight Squats":{muscle:"QUADS · GLUTES · HAMSTRINGS",diff:"⭐⭐",sets:"3 × 15 reps",tip:"Feet shoulder-width, toes out. Sit back like onto a chair. Chest up, drive through heels."},
  "Reverse Lunges":{muscle:"QUADS · GLUTES · BALANCE",diff:"⭐⭐",sets:"3 × 10 each leg",tip:"Step back and lower your back knee toward the floor. Push through front heel to stand. Torso upright."},
  "Glute Bridges":{muscle:"GLUTES · HAMSTRINGS · CORE",diff:"⭐",sets:"3 × 15 reps",tip:"Lie on back, feet flat. Drive hips to ceiling, squeeze glutes hard and hold 1 second. Lower slowly."},
  "Wall Sit":{muscle:"QUADS · GLUTES · CALVES",diff:"⭐⭐⭐",sets:"3 × 30 sec",tip:"Back flat on wall, thighs parallel to floor. THE ski exercise — your quads will burn just like the slopes!"},
  "Calf Raises":{muscle:"CALVES · ANKLE STABILITY",diff:"⭐",sets:"3 × 20 reps",tip:"Stand on edge of a step. Rise up on tiptoes as high as possible, lower slowly. Great for ski control."},
  "Superman Hold":{muscle:"LOWER BACK · GLUTES",diff:"⭐",sets:"3 × 10 reps",tip:"Lie face down. Lift both arms and legs off the ground simultaneously. Hold 2 secs, lower slowly."},
  "Pike Press Ups":{muscle:"SHOULDERS · TRICEPS",diff:"⭐⭐",sets:"3 × 8 reps",tip:"Press up position but hips high in a V. Bend elbows to lower head toward the floor between hands."},
  "Jump Squats":{muscle:"QUADS · GLUTES · POWER",diff:"⭐⭐⭐",sets:"3 × 10 reps",tip:"Squat down then explode upward off the floor. Land softly with bent knees. Great ski power builder."},
  "Walking Lunges":{muscle:"QUADS · GLUTES · BALANCE",diff:"⭐⭐",sets:"3 × 12 each leg",tip:"Step forward into a lunge, bring back foot through into next step. Torso upright, core engaged."},
  "Step Ups":{muscle:"QUADS · GLUTES · CALVES",diff:"⭐⭐",sets:"3 × 15 each leg",tip:"Step up onto a sturdy box or step, drive through heel. Step back down under control."},
  "Russian Twists":{muscle:"OBLIQUES · CORE",diff:"⭐⭐",sets:"3 × 20 reps",tip:"Sit at 45°, feet off floor. Rotate torso side to side touching floor each side. Hold weight to progress."},
  "Leg Raises":{muscle:"LOWER ABS · HIP FLEXORS",diff:"⭐⭐",sets:"3 × 12 reps",tip:"Lie flat, legs straight. Raise to 90° then lower slowly. Don't let feet touch the floor at the bottom."},
  "Bulgarian Split Squat":{muscle:"QUADS · GLUTES · BALANCE",diff:"⭐⭐⭐⭐",sets:"3 × 10 each leg",tip:"Rear foot elevated on a chair. Front foot forward. Lower back knee toward floor. Hardest leg exercise — best for skiing."},
  "Box Jumps":{muscle:"QUADS · GLUTES · POWER",diff:"⭐⭐⭐⭐",sets:"3 × 8 reps",tip:"Stand in front of sturdy box. Bend knees, swing arms, explode upward landing softly with bent knees. Step back down."},
  "Lateral Lunges":{muscle:"INNER THIGHS · GLUTES",diff:"⭐⭐",sets:"3 × 12 each side",tip:"Step wide to the side, push hips back and bend that knee. Other leg stays straight. Mimics ski movement."},
  "Skater Jumps":{muscle:"GLUTES · BALANCE · POWER",diff:"⭐⭐⭐",sets:"3 × 15 each side",tip:"Leap sideways from one foot to the other, landing on a single foot. Hold balance briefly. Directly mimics skiing."},
  "Dead Bug":{muscle:"DEEP CORE · STABILITY",diff:"⭐⭐",sets:"3 × 12 reps",tip:"Lie on back, arms up, knees at 90°. Lower opposite arm and leg slowly. Keep lower back flat throughout."},
  "Side Plank":{muscle:"OBLIQUES · SHOULDERS · HIPS",diff:"⭐⭐⭐",sets:"3 × 45 sec each",tip:"Balance on one forearm, feet stacked. Keep hips up, body in a straight line. Don't let hips sag."},
  "Goblet Squat":{muscle:"QUADS · GLUTES · CORE",diff:"⭐⭐",sets:"3 × 10 reps",tip:"Hold a dumbbell vertically at chest height. Squat down keeping elbows inside knees. Builds real squat strength beyond bodyweight."},
  "Dumbbell Romanian Deadlift":{muscle:"HAMSTRINGS · GLUTES · LOWER BACK",diff:"⭐⭐⭐",sets:"3 × 10 reps",tip:"Dumbbells in front of thighs, soft knees, hinge at hips pushing bum back. Keep back flat. Feel the hamstring stretch, don't round."},
  "Dumbbell Shoulder Press":{muscle:"SHOULDERS · TRICEPS · CORE",diff:"⭐⭐",sets:"3 × 10 reps",tip:"Press dumbbells overhead from shoulder height. Don't arch your back — keep core tight throughout."},
  "Dumbbell Bent-Over Row":{muscle:"BACK · BICEPS · REAR DELTS",diff:"⭐⭐",sets:"3 × 10 reps",tip:"Hinge forward, flat back, pull dumbbells to your ribs squeezing shoulder blades together. Builds the pulling strength bodyweight work misses."},
  "Dumbbell Goblet Lunge":{muscle:"QUADS · GLUTES · CORE",diff:"⭐⭐⭐",sets:"3 × 10 each leg",tip:"Hold dumbbell at chest, step into a lunge keeping torso upright. Adds real load to the ski-specific lunge pattern."},
  "Squat Pulses":{muscle:"QUADS · GLUTES · ENDURANCE",diff:"⭐⭐",sets:"3 × 15 reps",tip:"Lower to a half squat then pulse 2-3 inches up and down without locking out. Zero impact — builds the same quad endurance as jump squats without landing forces. Knee-friendly power alternative."},
  "Box Step-Down":{muscle:"QUADS · GLUTES · KNEE CONTROL",diff:"⭐⭐⭐",sets:"3 × 10 each leg",tip:"Stand on a low step, slowly lower one foot to the floor under control then step back up. Builds eccentric knee strength without any jumping or landing impact."},
  "Single Leg Balance Reach":{muscle:"GLUTES · BALANCE · STABILITY",diff:"⭐⭐⭐",sets:"3 × 8 each leg",tip:"Stand on one leg, hinge forward reaching opposite hand toward the floor, return to standing. Builds the single-leg stability skiing demands with zero impact on the knee."},
  "Side Step Squat":{muscle:"GLUTES · INNER & OUTER THIGH",diff:"⭐⭐",sets:"3 × 12 each side",tip:"Step sideways into a squat, push back to start. Mimics the skater jump pattern and lateral ski movement without ever leaving the floor."},
};

// 3 rotating session templates per phase — assigned to weeks in sequence
// Order logic: compound lift first (fresh, needs coordination) → power/control work → accessory moves → isometric holds/core last
// KNEE NOTE: all jumping/landing moves (Jump Squats, Box Jumps, Skater Jumps) replaced with zero-impact
// alternatives (Squat Pulses, Box Step-Down, Single Leg Balance Reach, Side Step Squat) given ongoing knee sensitivity.
// Mountain Climbers also removed — repeated fast knee-drive under load isn't ideal while the knee is niggly.
const SESSION_TEMPLATES={
  p1:[
    {key:"A",subtitle:"Push & Core",emoji:"💪",exercises:["Dumbbell Shoulder Press","Press Ups","Russian Twists","Plank"]},
    {key:"B",subtitle:"Legs & Glutes",emoji:"🦵",exercises:["Goblet Squat","Reverse Lunges","Glute Bridges","Wall Sit"]},
    {key:"C",subtitle:"Full Body",emoji:"🔥",exercises:["Dumbbell Bent-Over Row","Bodyweight Squats","Press Ups","Calf Raises","Superman Hold"]},
  ],
  p2:[
    {key:"A",subtitle:"Push & Core",emoji:"💪",exercises:["Dumbbell Shoulder Press","Press Ups","Russian Twists","Leg Raises","Plank"]},
    {key:"B",subtitle:"Legs Power",emoji:"🦵",exercises:["Goblet Squat","Squat Pulses","Walking Lunges","Step Ups","Wall Sit"]},

// Deload week template — every 4th week, lighter volume, no compound impact, focus on mobility + light strength
const DELOAD_SESSION={subtitle:"Deload — Lighter Week",emoji:"🌿",exercises:["Bodyweight Squats","Press Ups","Glute Bridges","Plank","Calf Raises"]};

function buildPhaseWeeks(phaseId,startWeek,endWeek,phaseName,color){
  const templates=SESSION_TEMPLATES[phaseId];
  const weeks=[];
  let t=0;
  for(let w=startWeek;w<=endWeek;w++){
    const isDeload=(w%4===0); // every 4th week globally is a deload
    const tmpl=isDeload?DELOAD_SESSION:templates[t%templates.length];
    weeks.push({
      week:w,
      phase:phaseName,
      color:color,
      deload:isDeload,
      workouts:[{
        id:phaseId+"_wk"+w,
        label:isDeload?"Friday — Deload":"Friday — Session "+tmpl.key,
        subtitle:tmpl.subtitle,
        emoji:tmpl.emoji,
        exercises:tmpl.exercises
      }]
    });
    if(!isDeload)t++;
  }
  return weeks;
}

// Ski goal is fully user-set, like the run goal — no fixed 29 Nov default.
function getSkiGoal(){return load("ski_goal",null);} // {startDate, targetDate}

const PHASE_DEFS=[
  {id:"p1",name:"Phase 1 — Foundation",color:"#f97316",originalWeeks:4},
  {id:"p2",name:"Phase 2 — Build",color:"#8b5cf6",originalWeeks:6},
  {id:"p3",name:"Phase 3 — Intensity",color:"#ef4444",originalWeeks:6},
  {id:"p4",name:"Phase 4 — Ski Ready",color:"#10b981",originalWeeks:8},
];
const ORIGINAL_TOTAL_WEEKS=PHASE_DEFS.reduce((a,p)=>a+p.originalWeeks,0); // 24

// Builds the full gym plan, scaling all 4 phases PROPORTIONALLY to fit however many weeks are
// actually available before the ski trip — rather than chopping weeks off the end (which would
// cut the ski-specific final phase short) or the start (which would skip foundation work).
function buildSkiPlan(goal){
  const start=new Date(goal.startDate),end=new Date(goal.targetDate);
  const requestedWeeks=Math.max(1,Math.round((end-start)/(7*24*60*60*1000)));
  const minTotal=PHASE_DEFS.length; // each phase needs at least 1 week
  const totalWeeks=Math.max(minTotal,requestedWeeks);
  const extended=totalWeeks>requestedWeeks;

  const ratios=PHASE_DEFS.map(p=>p.originalWeeks/ORIGINAL_TOTAL_WEEKS);
  let weeksPerPhase=ratios.map(r=>Math.max(1,Math.round(r*totalWeeks)));
  let diff=totalWeeks-weeksPerPhase.reduce((a,b)=>a+b,0);
  while(diff!==0){
    if(diff>0){weeksPerPhase[weeksPerPhase.indexOf(Math.max(...weeksPerPhase))]++;diff--;}
    else{const idx=weeksPerPhase.indexOf(Math.max(...weeksPerPhase));if(weeksPerPhase[idx]>1){weeksPerPhase[idx]--;diff++;}else break;}
  }

  let plan=[],weekCursor=1;
  PHASE_DEFS.forEach((p,i)=>{
    const phaseWeeks=weeksPerPhase[i];
    plan=plan.concat(buildPhaseWeeks(p.id,weekCursor,weekCursor+phaseWeeks-1,p.name,p.color));
    weekCursor+=phaseWeeks;
  });
  return {plan,totalWeeks,requestedWeeks,extended};
}

// Run plan is now generated dynamically based on user's starting fitness, target distance and date
function getRunGoal(){return load("run_goal",null);} // {fitness, targetKm, startDate, targetDate}

// Generates a plan using a capped weekly growth rate (15%) for the continuous-running build phase,
// always includes a taper week before the target date, and is honest about what's achievable —
// it will never silently produce a dangerous final-week distance jump.
// Fitness is now stored as actual continuous-run minutes (0, 5, 8, 10, 12, 15, 20, 25, 30+)
// rather than 3 coarse buckets — avoids treating an 8-min and 12-min runner identically.
function intervalRatioForMinutes(mins){
  if(mins<=0)return 0.5;
  if(mins>=20)return 0;
  return Math.max(0,0.5-(mins/20)*0.5);
}
// Used ONLY for the realistic-date calculation. Unlike intervalRatioForMinutes (which scales with
// whatever timeline the user picked), this is a FIXED number of weeks based purely on fitness level —
// it must stay constant regardless of the chosen date, otherwise "what's the realistic date" becomes
// circular: a longer chosen timeline -> more interval weeks -> later realistic date -> apply it ->
// timeline is now even longer -> even more interval weeks -> date moves again. (This was a real bug:
// tapping "USE THIS DATE INSTEAD" kept producing a new, later date each time instead of converging.)
function fixedIntervalWeeksForMinutes(mins){
  if(mins<=0)return 6;
  if(mins<10)return 4;
  if(mins<20)return 2;
  return 0;
}
function baseKmForMinutes(mins){
  // Calibrated against real beginner 10K plans (Hal Higdon Novice, Gymshark 8-10wk) which assume
  // a runner starting their plan can already run-walk roughly 2-3km, not pure continuous-running-only
  // distance. Someone who reports 10 continuous minutes can typically already cover more ground than
  // a strict minutes/pace conversion implies once walk breaks are allowed for.
  if(mins<=0)return 1.0; // true beginner, matches couch-to-5k starting point
  return Math.max(1.0,Math.round((1.0+mins*0.13)*10)/10);
}
function capForDistance(km){
  // Tiered growth cap calibrated against real coached plans, which grow distance much faster
  // than a flat 10%/week when starting from a small base (small absolute increases are low-risk),
  // then taper toward the standard "10% rule" once distances get larger.
  if(km<3)return 0.25;
  if(km<6)return 0.15;
  return 0.10;
}

function generateRunPlan(goal){
  const start=new Date(goal.startDate),end=new Date(goal.targetDate);
  const totalWeeks=Math.max(2,Math.round((end-start)/(7*24*60*60*1000)));
  const targetKm=goal.targetKm;
  const fitnessMins=goal.fitnessMins??0;
  const plan=[];
  let sessionId=1;

  // Uses the SAME fixed-week logic as the realistic-date calculation below, so the two stay
  // consistent with each other. Previously this scaled with totalWeeks (more weeks chosen ->
  // proportionally more interval weeks), which caused the "achievable" check to disagree with
  // the realistic date calculation — applying the suggested date could still show "not achievable"
  // because the actual plan ate into the build phase with more interval weeks than assumed.
  const intervalWeeks=Math.min(fixedIntervalWeeksForMinutes(fitnessMins),Math.max(0,totalWeeks-2));

  const hasTaper=totalWeeks>=3;
  const taperWeek=hasTaper?totalWeeks:0;
  const continuousWeeks=totalWeeks-intervalWeeks;
  const buildWeeks=hasTaper?Math.max(1,continuousWeeks-1):continuousWeeks;

  const baseKm=baseKmForMinutes(fitnessMins);

  // Build the week-by-week long-run distance progression using a tiered growth cap
  // (25% under 3km, 15% from 3-6km, 10% above 6km) rather than a single flat rate —
  // this matches how real coached plans (Hal Higdon Novice 10K, Gymshark 8-10wk) actually
  // progress: large relative jumps early when absolute distances are tiny and low-risk,
  // tapering toward the standard "10% rule" once distances get larger.
  const buildKmByWeek=[];
  if(buildWeeks>0){
    let km=baseKm;
    buildKmByWeek.push(Math.round(km*100)/100);
    for(let w=1;w<buildWeeks;w++){
      const cap=capForDistance(km);
      km=Math.min(targetKm,km*(1+cap));
      buildKmByWeek.push(Math.round(km*100)/100);
    }
  }
  const finalBuildKm=buildKmByWeek.length>0?buildKmByWeek[buildKmByWeek.length-1]:baseKm;
  const achievable=finalBuildKm>=targetKm-0.05; // small tolerance for rounding
  const effectiveTargetKm=achievable?targetKm:finalBuildKm;
  const maxAchievableKm=finalBuildKm;

  // If not achievable by the chosen date, work out how many additional build weeks it would
  // actually take to reach the real target using the same tiered-cap progression, then convert
  // that into a realistic calendar date so the user knows when they could genuinely hit their goal.
  let realisticDate=null;
  if(!achievable){
    let km=baseKm,extraWeeks=0;
    const MAX_ITER=500;
    while(km<targetKm-0.05&&extraWeeks<MAX_ITER){
      const cap=capForDistance(km);
      km=Math.min(targetKm,km*(1+cap));
      extraWeeks++;
    }
    // Uses a FIXED interval-week count based on fitness only — not the chosen timeline's intervalWeeks —
    // so this answer is stable and doesn't shift every time it's applied. Calculated forward from
    // today (not the original goal start date) so the answer reflects "from now", which is what
    // actually matters when the user taps "USE THIS DATE INSTEAD".
    // NOTE: buildKmByWeek's first entry is the starting point itself (no growth applied), and only
    // the remaining buildWeeks-1 entries represent actual growth steps — so extraWeeks here must
    // match that same convention (the starting week counts, then N-1 growth weeks) to stay consistent
    // with how the plan above is actually built. Previously this counted pure growth steps only,
    // landing one week short of what the real plan could achieve in the same number of weeks.
    const fixedIntervalWeeks=fixedIntervalWeeksForMinutes(fitnessMins);
    const realisticTotalWeeks=fixedIntervalWeeks+extraWeeks+1+1; // +1 taper, +1 to align with buildKmByWeek's convention
    const today=new Date();
    const realisticMs=today.getTime()+realisticTotalWeeks*7*24*60*60*1000;
    realisticDate=new Date(realisticMs).toISOString().slice(0,10);
  }

  for(let w=1;w<=totalWeeks;w++){
    const sessions=[];
    const isTaper=w===taperWeek&&hasTaper;
    if(w<=intervalWeeks){
      // 2 sessions/week to match the actual schedule: Mon easy intervals, Sat slightly longer intervals
      // Progress is 0-indexed so week 1 of the interval phase always starts EASIEST (short run, long rest)
      // and only the final interval week reaches the hardest setting. Previously this used w/intervalWeeks,
      // which made week 1 of a short (1-2 week) interval phase jump straight to peak difficulty — fixed.
      // Starting run length now also scales with fitnessMins — previously a 0-min and 10-min runner both
      // started week 1 at the same 1-minute interval, ignoring the fitness input entirely.
      const intervalProgress=intervalWeeks<=1?0:(w-1)/(intervalWeeks-1);
      const startMin=Math.max(1,Math.min(8,Math.round(fitnessMins*0.6*2)/2));
      const peakMin=Math.max(startMin+1,7);
      const runMin=Math.round((startMin+intervalProgress*(peakMin-startMin))*2)/2;
      const restMin=Math.max(1,Math.round((2.5-intervalProgress*1.5)*2)/2);
      const rounds=Math.max(2,Math.round(7-intervalProgress*3));
      for(let s=0;s<2;s++){
        sessions.push({id:sessionId++,run:Math.round((runMin+s*0.5)*10)/10,rest:restMin,rounds:rounds,day:s===0?"Mon — Easy Run":"Sat — Long Run",label:s===0?"Mon — Easy Run":"Sat — Long Run"});
      }
    } else {
      // 2 sessions/week: Mon = easy run (shorter), Sat = long run (this week's distance from the simulated build curve)
      const contWeekNum=w-intervalWeeks;
      let weekLongKm;
      if(isTaper){
        weekLongKm=Math.round(finalBuildKm*0.55*10)/10;
      } else {
        const idx=Math.min(contWeekNum-1,buildKmByWeek.length-1);
        weekLongKm=buildKmByWeek[idx]??finalBuildKm;
      }
      const easyKm=Math.round(weekLongKm*0.55*10)/10;
      [{km:easyKm,day:"Mon — Easy Run"},{km:weekLongKm,day:"Sat — Long Run"}].forEach(({km,day})=>{
        sessions.push({id:sessionId++,run:Math.round(km*7),rest:0,rounds:1,km:Math.round(km*10)/10,day:day,label:day});
      });
    }
    plan.push({week:w,sessions,isTaper});
  }
  return {plan,achievable,effectiveTargetKm,maxAchievableKm:Math.round(maxAchievableKm*10)/10,totalWeeks,realisticDate};
}

function buildMilestones(goal){
  if(!goal)return[];
  const totalLoss=goal.startLbs-goal.goalLbs;
  if(totalLoss<=0)return[{label:"Start",target:goal.startLbs},{label:"Goal",target:goal.goalLbs}];
  const start=new Date(goal.startDate),end=new Date(goal.targetDate);
  const totalWeeks=Math.max(1,Math.round((end-start)/(7*24*60*60*1000)));
  const checkpoints=[0,Math.round(totalWeeks*0.25),Math.round(totalWeeks*0.5),Math.round(totalWeeks*0.75),totalWeeks];
  const uniqueWeeks=[...new Set(checkpoints)];
  return uniqueWeeks.map(w=>({
    label:w===0?"Start":w===totalWeeks?"Goal 🎯":"Wk "+w,
    target:Math.round(goal.startLbs-(totalLoss*(w/totalWeeks)))
  }));
}

}

function getCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx}
function beep(f,d,g){try{const ctx=getCtx(),o=ctx.createOscillator(),gn=ctx.createGain();o.connect(gn);gn.connect(ctx.destination);o.frequency.value=f;gn.gain.setValueAtTime(g,ctx.currentTime);gn.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+d);o.start();o.stop(ctx.currentTime+d)}catch(e){}}
function dblBeep(){beep(523,0.15,0.5);setTimeout(()=>beep(784,0.25,0.6),160)}
function triBeep(){beep(400,0.12,0.5);setTimeout(()=>beep(500,0.12,0.5),120);setTimeout(()=>beep(700,0.3,0.6),240)}
function toLbs(v,u){const n=parseFloat(v);if(isNaN(n)||n<=0)return null;if(u==="lbs")return Math.round(n*10)/10;if(u==="kg")return Math.round(n*2.2046*10)/10;return Math.round(n*14*10)/10}
function dispW(lbs,u){if(u==="lbs")return Math.round(lbs)+"lbs";if(u==="kg")return(lbs/2.2046).toFixed(1)+"kg";return lbsToSt(lbs)}
function lbsToSt(lbs){return Math.floor(lbs/14)+"st "+Math.round(lbs%14)+"lb"}
function fmt(s){return Math.floor(s/60)+":"+(s%60).toString().padStart(2,"0")}

function buildQueue(s){
  const q=[],rs=Math.round(s.run*60),ws=Math.round(s.rest*60);
  q.push({type:"WARMUP",dur:300,round:0});
  for(let i=0;i<s.rounds;i++){q.push({type:"RUN",dur:rs,round:i+1});if(ws>0)q.push({type:"REST",dur:ws,round:i+1});}
  q.push({type:"COOLDOWN",dur:300,round:0});
  return q;
}
function startTimer(s){const q=buildQueue(s);timer={session:s,queue:q,qi:0,rem:q[0].dur,running:true,done:false};tab="timer";render();runTimer()}
function runTimer(){
  clearInterval(timerInt);
  timerInt=setInterval(()=>{
    if(!timer||!timer.running||timer.done)return;
    timer.rem--;
    if(timer.rem===3)beep(440,0.15,0.45);
    else if(timer.rem===2)beep(440,0.15,0.45);
    else if(timer.rem===1)beep(587,0.2,0.55);
    if(timer.rem<=0){const next=timer.qi+1;if(next>=timer.queue.length){triBeep();clearInterval(timerInt);timer.done=true;timer.running=false;}else{dblBeep();timer.qi=next;timer.rem=timer.queue[next].dur;}}
    render();
  },1000);
}
function stopTimer(){clearInterval(timerInt);timer=null;tab="run";render()}

    const realisticDateDisplay=result.realisticDate?new Date(result.realisticDate).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}):null;
    html+=`<div style="margin:10px 16px;background:#fef2f2;border:2px solid #fecaca;border-radius:12px;padding:12px 14px">

        <div style="font-size:11px;color:#7f1d1d;font-weight:600;margin-top:4px">That's when you'd safely reach ${goal.targetKm}km following the same gradual progression.</div>

      </div>`:""}
      <button onclick="dismissShortTimelineWarning('${goalKey}')" style="width:100%;margin-top:8px;background:#fff;border:1.5px solid #fca5a5;border-radius:8px;color:#7f1d1d;padding:9px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;cursor:pointer">KEEP MY CURRENT DATE — I'M OK WITH ${result.effectiveTargetKm}KM</button>

    html+=`<div class="wk-block"><div class="wk-label">WEEK ${week.week}${week.isTaper?' <span style="background:#dcfce7;color:#16a34a;padding:1px 8px;border-radius:10px;letter-spacing:1px;font-size:10px">🌿 TAPER</span>':""}</div>`;

      const isMissed=runMissed.includes(s.id);
      const label=s.day||"Run Session";
      const metaText=s.km
        ?`🟣 5min warm up · ${s.km}km continuous run (~${s.run}min) · 🟢 5min cool down`
        :`🟣 5min warm up · ${s.run}min run${s.rest>0?" / "+s.rest+"min rest":""} × ${s.rounds} · 🟢 5min cool down`;
      let cardClass=isDone?" done-today":isMissed?" missed-session":"";
      let rightSide;
      if(isDone){rightSide='<span style="font-size:20px">🔥</span>';}
      else if(isMissed){rightSide=`<button onclick="toggleMissed(${s.id})" style="background:#fee2e2;border:1.5px solid #fca5a5;border-radius:8px;color:#dc2626;padding:6px 10px;font-size:10px;font-weight:800;cursor:pointer">↺ UNDO</button>`;}
      else{rightSide=`<button class="start-btn" onclick="startTimerByGenId(${s.id})">▶ START</button><button onclick="toggleMissed(${s.id})" title="Mark as missed" style="background:none;border:1.5px solid #e2e8f0;border-radius:8px;color:#a8a29e;padding:6px 8px;font-size:10px;font-weight:800;cursor:pointer;margin-left:4px">✕</button>`;}
      html+=`<div class="card${cardClass}"><button class="chk${isDone?" done":""}" onclick="toggleRun(${s.id})" ${isMissed?"disabled":""}>${isDone?"✓":""}</button><div style="flex:1"><div class="sname">${label}${isMissed?' <span style="color:#dc2626;font-size:10px;font-weight:800;letter-spacing:1px">MISSED</span>':""}</div><div class="smeta">${metaText}</div></div>${rightSide}</div>`;
    });
    html+="</div>";
  });
  html+=`<div style="padding:12px 16px"><div class="card race-card${isRaceDay?" race-day":""}"><span style="font-size:24px">🏁</span><div style="flex:1"><div class="sname">${isRaceDay?"TODAY'S THE DAY":"RACE DAY"} — ${displayKm}KM</div><div class="smeta">${targetDateDisplay.toUpperCase()} · ${isRaceDay?"YOU'VE GOT THIS!":"GO GET IT!"}</div></div>${resolvedCount===totalSessions?'<span style="font-size:20px">🏆</span>':""}</div></div></div>`;
  return html;
}

let selectedFitness=null; // store as number; null means "not yet selected" (0 is a valid selection)
function selectFitness(val){
  selectedFitness=val;
  const inputEl=document.getElementById("fitnessMinsInput");
  const zeroBtn=document.getElementById("cantRunYetBtn");
  if(val===0){
    if(inputEl)inputEl.value="";
    if(zeroBtn){zeroBtn.style.borderColor="#f97316";zeroBtn.style.background="#fff7ed";zeroBtn.style.color="#ea580c";}
  }
}
function onFitnessInput(){
  const inputEl=document.getElementById("fitnessMinsInput");
  const zeroBtn=document.getElementById("cantRunYetBtn");
  const val=parseFloat(inputEl.value);
  if(zeroBtn){zeroBtn.style.borderColor="#fed7aa";zeroBtn.style.background="#fff";zeroBtn.style.color="#78716c";}
  selectedFitness=(!isNaN(val)&&val>=0)?val:null;
}
function setRunGoal(){
  if(selectedFitness===null){alert("Please enter how many minutes you can currently run, or tap \"I can't run continuously yet\"!");return;}
  if(selectedFitness<0||selectedFitness>60){alert("Please enter a realistic number of minutes (0–60).");return;}
  const kmEl=document.getElementById("targetKm");
  const dateEl=document.getElementById("runTargetDate");
  const km=parseFloat(kmEl.value);
  const date=dateEl.value;
  if(!date){alert("Please choose a target date!");return;}
  if(!km||km<=0||km>200){alert("Please enter a realistic target distance (e.g. between 1 and 200km).");return;}
  const todayMidnight=new Date();todayMidnight.setHours(0,0,0,0);
  const chosenDate=new Date(date+"T00:00:00");
  if(chosenDate<=todayMidnight){alert("Please choose a target date in the future!");return;}
  const goal={fitnessMins:selectedFitness,targetKm:km,startDate:new Date().toISOString().slice(0,10),targetDate:date};
  save("run_goal",goal);
  selectedFitness=null;
  render();
}
function editRunGoal(){
  const hasCompletedRuns=runDone.length>0||runMissed.length>0;
  if(hasCompletedRuns){
    const confirmed=confirm("You've already ticked off some runs on your current plan. Changing your target will rebuild the week numbering — your tick history is tied to session numbers, so some completed sessions may no longer line up correctly. Continue?");
    if(!confirmed)return;
  }
  save("run_goal",null);render();
}
function applyRealisticDate(newDate){
  const goal=getRunGoal();
  if(!goal)return;
  goal.targetDate=newDate;
  save("run_goal",goal);
  render();
}
function dismissShortTimelineWarning(goalKey){
  dismissedShortTimelineFor=goalKey;
  save("dismissed_short_timeline",goalKey);
  render();
}
function startTimerByGenId(id){
  const goal=getRunGoal();
  if(!goal)return;
  const result=generateRunPlan(goal);
  const s=result.plan.flatMap(w=>w.sessions).find(s=>s.id===id);
  if(s)startTimer(s);
}

        <input id="goalDate" type="date" style="display:block;width:100%;box-sizing:border-box;background:#fff;border:2px solid #fed7aa;border-radius:10px;padding:12px;color:#1c1917;font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;outline:none;-webkit-appearance:none;appearance:none"/>
      </div>
      <button class="log-btn" onclick="setWeightGoal()" style="width:100%;padding:12px">SET MY GOAL 🎯</button>
    </div>`;
    if(wlog.length>0){
      html+=`<div class="stitle">HISTORY</div>`;
      wlog.forEach((e,i)=>{const prev=wlog[i+1],delta=prev?e.lbs-prev.lbs:null,d=new Date(e.date);html+=`<div class="hist-item"><div class="hist-date">${d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</div><div class="hist-w">${dispW(e.lbs,wunit)}</div><div style="display:flex;align-items:center;gap:6px">${delta!==null?`<span class="delta ${delta<0?"dg":"db"}">${delta<0?"▼":"▲"} ${Math.abs(delta).toFixed(1)}lb</span>`:""}<button class="del" onclick="delWeight(${e.id})">✕</button></div></div>`;});
    }
    html+="</div></div>";
    return html;
  }

  const MS=buildMilestones(goal);
  const SW=goal.startLbs,GW=goal.goalLbs;
  const latest=wlog[0]?.lbs??SW,lost=SW-latest,pctg=Math.min(100,Math.max(0,Math.round(lost/(SW-GW||1)*100)));
  // Compares calendar dates (not raw millisecond subtraction) to avoid timezone drift —
  // previously, "days left" could show as negative ("date has passed") on the actual target
  // day itself once it got late in the evening locally, because the target was parsed as
  // midnight UTC while "now" used the local timezone.
  const todayMidnight=new Date();todayMidnight.setHours(0,0,0,0);
  const targetMidnightLocal=new Date(goal.targetDate+"T00:00:00");
  const daysLeft=Math.round((targetMidnightLocal-todayMidnight)/(24*60*60*1000));

  html+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <div class="stitle" style="margin-bottom:0">YOUR PROGRESS</div>
    <button onclick="editWeightGoal()" style="background:none;border:1.5px solid #fed7aa;border-radius:8px;color:#ea580c;padding:4px 10px;font-size:10px;font-weight:800;cursor:pointer">✏️ EDIT GOAL</button>
  </div>`;
  html+=`<div class="stats"><div class="scard"><div class="sval">${lbsToSt(latest)}</div><div class="slbl">CURRENT</div></div><div class="scard"><div class="sval" style="color:${lost>0?"#16a34a":"#ea580c"}">${lost>0?"-"+lbsToSt(Math.abs(lost)):"—"}</div><div class="slbl">LOST</div></div><div class="scard"><div class="sval" style="color:#ea580c">${pctg}%</div><div class="slbl">TO GOAL</div></div></div>`;
  html+=`<div style="text-align:center;font-size:11px;font-weight:700;color:#78716c;margin-bottom:14px">${daysLeft>0?daysLeft+" days until your target date":daysLeft===0?"🎯 Today's the day!":"Target date has passed"}</div>`;
  html+=`<div class="stitle">MILESTONES</div><div class="ms-row">`;
  MS.forEach((m,i)=>{const reached=latest<=m.target,cur=!reached&&(i===0||latest<=MS[i-1]?.target+3);html+=`<div class="ms-dot-wrap"><div class="ms-dot${reached?" reached":cur?" current":""}">${reached?"✓":""}</div><div class="ms-wk">${m.label}</div><div class="ms-tgt">${lbsToSt(m.target)}</div></div>`;});
  html+="</div>";
  html+=`<div class="chart-box"><div class="chart-title">WEIGHT TREND · <span style="color:#86efac">— TARGET</span></div>`;
  const entries=[...wlog].reverse().slice(0,20);
  if(entries.length<2){html+='<div class="empty">LOG 2+ ENTRIES TO SEE CHART</div>';}
  else{const W=260,H=75,vals=entries.map(e=>e.lbs),minW=Math.min(...vals)-4,maxW=Math.max(...vals)+4;const pts=entries.map((e,i)=>`${(i/(entries.length-1))*W},${H-((e.lbs-minW)/(maxW-minW))*H}`).join(" ");const gY=H-((GW-minW)/(maxW-minW))*H;html+=`<svg width="100%" viewBox="0 0 ${W} ${H+8}" style="overflow:visible">${gY>0&&gY<H?`<line x1="0" y1="${gY}" x2="${W}" y2="${gY}" stroke="#86efac" stroke-width="1.5" stroke-dasharray="5,4"/>`:""}<polyline points="${pts}" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${entries.map((e,i)=>{const x=(i/(entries.length-1))*W,y=H-((e.lbs-minW)/(maxW-minW))*H;return`<circle cx="${x}" cy="${y}" r="4" fill="#f97316" stroke="#fff" stroke-width="1.5"/>`;}).join("")}</svg>`;}
  html+="</div>";
  html+=`<div class="stitle">LOG WEIGHT</div><div class="units"><button class="${wunit==="st"?"active":""}" onclick="setUnit('st')">ST</button><button class="${wunit==="lbs"?"active":""}" onclick="setUnit('lbs')">LBS</button><button class="${wunit==="kg"?"active":""}" onclick="setUnit('kg')">KG</button></div><div class="log-row"><input class="winput" id="winput" type="number" step="0.1" placeholder="${wunit==="st"?"e.g. 16.5":wunit==="lbs"?"e.g. 231":"e.g. 104.8"}"/><button class="log-btn" onclick="logWeight()">LOG ＋</button></div>${wunit==="st"?'<div style="font-size:10px;color:#a8a29e;font-weight:700;margin-bottom:12px">DECIMAL STONES — 16.5 = 16st 7lb</div>':""}`;
  if(wlog.length>0){html+=`<div class="stitle" style="margin-top:14px">HISTORY</div>`;wlog.forEach((e,i)=>{const prev=wlog[i+1],delta=prev?e.lbs-prev.lbs:null,d=new Date(e.date);html+=`<div class="hist-item"><div class="hist-date">${d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</div><div class="hist-w">${dispW(e.lbs,wunit)}</div><div style="display:flex;align-items:center;gap:6px">${delta!==null?`<span class="delta ${delta<0?"dg":"db"}">${delta<0?"▼":"▲"} ${Math.abs(delta).toFixed(1)}lb</span>`:""}<button class="del" onclick="delWeight(${e.id})">✕</button></div></div>`;});}
  else{html+='<div class="empty">LOG YOUR FIRST WEIGH-IN</div>';}
  html+="</div></div>";return html;
}

function setWeightGoal(){
  const curEl=document.getElementById("goalCurrent");
  const tgtEl=document.getElementById("goalTarget");
  const dateEl=document.getElementById("goalDate");
  const curLbs=toLbs(curEl.value,wunit);
  const tgtLbs=toLbs(tgtEl.value,wunit);
  const date=dateEl.value;
  if(!curLbs||!tgtLbs||!date){alert("Please fill in all three fields!");return;}
  const todayMidnight=new Date();todayMidnight.setHours(0,0,0,0);
  const chosenDate=new Date(date+"T00:00:00");
  if(chosenDate<=todayMidnight){alert("Please choose a target date in the future!");return;}
  const goal={startLbs:curLbs,goalLbs:tgtLbs,startDate:new Date().toISOString().slice(0,10),targetDate:date};
  save("weight_goal",goal);
  render();
}
function editWeightGoal(){save("weight_goal",null);render();}

function renderTimer(){
  if(!timer)return"";
  let html=`<button class="back-btn" onclick="stopTimer()">← BACK</button>`;
  if(timer.done){
    html+=`<div class="tscreen"><div class="bounce">🎉</div><div class="done-banner">SESSION DONE!</div><div style="color:#78716c;font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:4px">${timer.session.label.toUpperCase()}</div><div style="color:#a8a29e;font-size:11px;font-weight:700">Stretch it out! 🟢</div><button class="mark-btn" onclick="markRunDone()">MARK AS DONE ✓</button></div>`;
  }else{
    const phase=timer.queue[timer.qi],t=phase.type;
    const COLOR={WARMUP:"#8b5cf6",RUN:"#f97316",REST:"#3b82f6",COOLDOWN:"#10b981"};
    const BG={WARMUP:"#f5f3ff",RUN:"#fff7ed",REST:"#eff6ff",COOLDOWN:"#ecfdf5"};
    const TRACK={WARMUP:"#c4b5fd",RUN:"#fed7aa",REST:"#bfdbfe",COOLDOWN:"#a7f3d0"};
    const LABEL={WARMUP:"WARM UP 🟣",RUN:"RUN 🏃",REST:"REST 💨",COOLDOWN:"COOL DOWN 🟢"};
    const INFO={WARMUP:"EASY WALK — GET READY",RUN:"ROUND "+phase.round+" OF "+timer.session.rounds,REST:"WALK — CATCH YOUR BREATH",COOLDOWN:"SLOW WALK — WIND DOWN"};
    const color=COLOR[t],bg=BG[t],track=TRACK[t],frac=timer.rem/phase.dur,r=88,circ=2*Math.PI*r;
    html+=`<div class="tscreen" style="background:linear-gradient(160deg,${bg},#fff)">
      <div style="margin-bottom:6px;font-size:11px;color:#78716c;font-weight:800;letter-spacing:2px">${timer.session.label.toUpperCase()}</div>
      <div class="ring-wrap" style="background:${bg};box-shadow:0 0 40px ${color}33">
        <svg class="ring-svg" width="200" height="200" viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="${r}" fill="none" stroke="${track}" stroke-width="9"/>
          <circle cx="100" cy="100" r="${r}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-frac)}" style="transition:stroke-dashoffset 0.9s linear"/>
        </svg>
        <div class="ring-center"><div class="phase-lbl" style="color:${color}">${LABEL[t]}</div><div class="bigtime" style="color:${color}">${fmt(timer.rem)}</div></div>
      </div>
      <div class="round-info">${INFO[t]}</div>
      <div class="ctrl-row"><button class="ctrl sm" onclick="stopTimer()">■</button><button class="ctrl big" onclick="pauseTimer()">${timer.running?"⏸":"▶"}</button><button class="ctrl sm" onclick="skipTimer()">⏭</button></div>
      <div class="qdots">${timer.queue.map((q,i)=>{const qc=COLOR[q.type],qf=TRACK[q.type];return`<div class="qdot" style="background:${i<timer.qi?"#d1d5db":i===timer.qi?qc:qf};transform:${i===timer.qi?"scale(1.5)":"scale(1)"}"></div>`;}).join("")}</div>
      <div style="margin-top:14px;display:flex;gap:10px;font-size:10px;font-weight:700"><span style="color:#8b5cf6">🟣 Warm</span><span style="color:#f97316">🟠 Run</span><span style="color:#3b82f6">🔵 Rest</span><span style="color:#10b981">🟢 Cool</span></div>
    </div>`;
  }
  return html;
}

function attachEvents(){
  const wi=document.getElementById("winput");
  if(wi)wi.addEventListener("keydown",e=>{if(e.key==="Enter")logWeight()});
}

function setTab(t){tab=t;render()}
function setUnit(u){wunit=u;render()}
function toggleRun(id){runDone=runDone.includes(id)?runDone.filter(x=>x!==id):[...runDone,id];save("c6k_done",runDone);render()}
function toggleMissed(id){
  if(runMissed.includes(id)){runMissed=runMissed.filter(x=>x!==id);}
  else{runMissed=[...runMissed,id];if(runDone.includes(id)){runDone=runDone.filter(x=>x!==id);save("c6k_done",runDone);}}
  save("c6k_missed",runMissed);
  render();
}
// startTimerByGenId (defined above) replaces the old static startTimerById
// stopTimer is defined earlier in the file (with the other timer control functions)
function pauseTimer(){if(!timer)return;timer.running=!timer.running;if(timer.running)runTimer();else clearInterval(timerInt);render()}
function skipTimer(){if(!timer)return;const next=timer.qi+1;if(next>=timer.queue.length){timer.done=true;timer.running=false;clearInterval(timerInt);}else{timer.qi=next;timer.rem=timer.queue[next].dur;}render()}
function markRunDone(){if(timer&&!runDone.includes(timer.session.id)){runDone=[...runDone,timer.session.id];save("c6k_done",runDone)}stopTimer()}
function logWeight(){const inp=document.getElementById("winput");if(!inp)return;const lbs=toLbs(inp.value,wunit);if(!lbs||lbs<50||lbs>600)return;wlog=[{lbs,date:new Date().toISOString(),id:Date.now()},...wlog];save("c6k_wt",wlog);render()}
function delWeight(id){wlog=wlog.filter(e=>e.id!==id);save("c6k_wt",wlog);render()}
function showWorkout(id){modalWorkout=id;render()}
function closeModal(e){if(e.target.classList.contains("modal-overlay")){modalWorkout=null;render()}}
function toggleHistory(sk,wid){const k=sk+"_"+wid;expandedHistory[k]=!expandedHistory[k];render()}

function logSet(sk,setNum,workoutId){
  const repsEl=document.getElementById("r_"+sk+"_"+setNum);
  const wtEl=document.getElementById("w_"+sk+"_"+setNum);
  const reps=repsEl?parseInt(repsEl.value)||null:null;
  const weight=wtEl?parseFloat(wtEl.value)||null:null;
  if(!reps){alert("Enter reps first!");return;}
  currentSession[sk+"_"+setNum]={reps,weight,done:true};
  saveAll();render();
}

function saveSession(workoutId){
  const skiGoal=getSkiGoal();
  if(!skiGoal)return;
  const workout=buildSkiPlan(skiGoal).plan.flatMap(p=>p.workouts).find(w=>w.id===workoutId);
  if(!workout)return;
  const now=new Date().toISOString();
  workout.exercises.forEach(name=>{
    const sk=name.replace(/[^a-zA-Z0-9]/g,"");
    const sets=[];
    for(let s=1;s<=3;s++){const cs=currentSession[sk+"_"+s];sets.push(cs&&cs.done?{reps:cs.reps,weight:cs.weight}:{reps:null,weight:null});}
    if(sets.some(s=>s.reps)){
      if(!gymLogs[sk])gymLogs[sk]=[];
      gymLogs[sk].push({workoutId,date:now,sets});
    }
  });
  currentSession={};currentSessionId="";
  saveAll();
  // Also mark done today
  gymDoneToday[workoutId]=todayDate();
  save("gym_done_today",gymDoneToday);
  alert("✅ Session saved!");
  modalWorkout=null;render();
}

render();
</script>
